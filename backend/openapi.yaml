          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [universities]
      summary: Delete university
      operationId: deleteUniversityById
      responses:
        '204':
          description: University deleted
        '404':
          $ref: '#/components/responses/NotFound'
