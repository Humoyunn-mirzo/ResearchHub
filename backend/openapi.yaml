  /api/universities:
    security:
      - accessTokenBearer: []

    get:
      tags: [universities]
      summary: Get all universities
      operationId: getAllUniversities
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
