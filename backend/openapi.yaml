openapi: 3.0.3

info:
  title: Research Hub API
  description: >
    REST API for managing resources in the Research Hub Backend system.
  version: 1.0.0
  contact:
    name: Komil Tokhirov
    email: komil.tokhirov@gmail.com

servers:
  - url: http://localhost
    description: Local development
  # - url: https://example.com
  #   description: Production

tags:
  - name: auth
  - name: students
    # description: Authentication endpoints
  # - name: students
  #   description: Student management endpoints

components:
  schemas:
    ResponseMeta:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          format: date-time

    ResponsePagination:
      type: object
      required:
        - page
        - size
        - totalElements
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 124

    ErrorResponse:
      type: object
      required:
        - timestamp
        - message
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string


    ID:
      type: object
      required:
        - id
      properties:
        name:
          type: string
          format: uuid

    Student:
      type: object
      required:
        - name
        - email
        - universityId
        - fieldOfInterest
        - bio
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        universityId:
          type: string
          format: uuid
        fieldOfInterest:
          type: string
        bio:
          type: string

    Professor:
      required:
        - name
        - email
        - universityId
        - fieldOfStudy
        - bio
        - rankingScore
        - totalProjects
        - studentsSupervised
        - acceptanceRate
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        universityId:
          type: string
          format: uuid
        fieldOfInterest:
          type: string
        bio:
          type: string
        rankingScore:
          type: integer
        totalProjects:
          type: integer
        studentsSupervised:
          type: integer
        acceptanceRate:
          type: number

  parameters:
    ID:
      name: id
      in: path
      required: true
      description: ID of object
      schema:
        type: string
        format: uuid

    PageNumber:
      name: page
      in: query
      description: Zero-based page index
      schema:
        type: integer
        minimum: 0
        default: 0

    PageSize:
      name: size
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    # 400
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    # 401
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    # 403
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    # 404
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /api/students:
    get:
      tags: [students]
      summary: Get all students
      operationId: getAllStudents
      parameters:
        - $ref: '#components/parameters/PageNumber'
        - $ref: '#components/parameters/PageSize'
      responses:
        '200':
          description: List of students
          content:
            application/json:
              schema:
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
                pagination:
                  $ref: '#/components/schemas/ResponsePagination'
                data: 
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/ID'
                      - $ref: '#/components/schemas/Student'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [students]
      summary: Create a new student
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Student'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
                data: 
                  allOf:
                    - $ref: '#/components/schemas/ID'
                    - $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/students/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'

    get:
      tags: [students]
      summary: Get student by ID
      operationId: getStudentById
      responses:
        '200':
          description: Student found
          content:
            application/json:
              schema:
                meta: 
                  $ref: '#/components/schemas/ResponseMeta'
                data: 
                  allOf:
                    - $ref: '#/components/schemas/ID'
                    - $ref: '#/components/schemas/Student'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [students]
      summary: Delete student
      operationId: deleteStudent
      responses:
        '204':
          description: Student deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/professors:
    get:
      tags: [professors]
      summary: Get all professors
      operationId: getAllProfessors
      parameters:
        - $ref: '#components/parameters/PageNumber'
        - $ref: '#components/parameters/PageSize'
      responses:
        '200':
          description: List of professors
          content:
            application/json:
              schema:
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
                pagination:
                  $ref: '#/components/schemas/ResponsePagination'
                data:
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/ID'
                      - $ref: '#/components/schemas/Professor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [professors]
      summary: Create a new professor
      operationId: createProfessor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfessorRequest'
      responses:
        '201':
          description: Professor created
          content:
            application/json:
              schema:
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
                data: 
                  allOf:
                    - $ref: '#/components/schemas/ID'
                    - $ref: '#/components/schemas/Professor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/professors/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'

    get:
      tags: [professors]
      summary: Get professor by ID
      operationId: getProfessorById
      responses:
        '200':
          description: Professor found
          content:
            application/json:
              schema:
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
                data:
                  allOf:
                    - $ref: '#/components/schemas/ID'
                    - $ref: '#/components/schemas/Professor'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [professors]
      summary: Delete professor
      operationId: deleteProfessor
      responses:
        '204':
          description: Professor deleted
        '404':
          $ref: '#/components/responses/NotFound'
