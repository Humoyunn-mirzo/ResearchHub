openapi: 3.0.3

info:
  title: Research Hub API
  description: >
    REST API for managing resources in the Research Hub Backend system.
  version: 1.0.0
  contact:
    name: Komil Tokhirov
    email: komil.tokhirov@gmail.com

servers:
  - url: http://localhost
    description: Local development
  # - url: https://example.com
  #   description: Production

tags:
  - name: auth
  - name: students
    # description: Authentication endpoints
  # - name: students
  #   description: Student management endpoints

components:
  securitySchemes:
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken

    accessTokenBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ResponseMeta:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          format: date-time

    ResponsePagination:
      type: object
      required:
        - page
        - size
        - totalElements
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 124

    GenericResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    GenericListResponse:
      type: object
      required:
        - meta
        - pagination
        - data
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        pagination:
          $ref: '#/components/schemas/ResponsePagination'


    ErrorResponse:
      type: object
      required:
        - timestamp
        - message
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string

    AccessToken:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          format: jwt

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 128
      # TODO: maybe enforce some conditions
      # pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&]).+$'
      description: Must be 8-128 characters


    StudentResponse:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StudentResponseBase'

    StudentListResponse:
      allOf:
        - $ref: '#/components/schemas/GenericListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StudentResponseBase'

    ProfessorResponse:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ProfessorResponseBase'

    ProfessorListResponse:
      allOf:
        - $ref: '#/components/schemas/GenericListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProfessorResponseBase'

    ResearchProjectResponse:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResearchProjectResponseBase'

    ResearchProjectListResponse:
      allOf:
        - $ref: '#/components/schemas/GenericListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ResearchProjectResponseBase'

    ApplicationResponse:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ApplicationResponseBase'

    ApplicationListResponse:
      allOf:
        - $ref: '#/components/schemas/GenericListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationResponseBase'

    UniversityResponse:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UniversityResponseBase'

    UniversityListResponse:
      allOf:
        - $ref: '#/components/schemas/GenericListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/UniversityResponseBase'

    StudentResponseBase:
      type: object
      required:
        - id
        - name
        - email
        - universityId
        - fieldOfInterest
        - bio
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        universityId:
          type: string
          format: uuid
        fieldOfInterest:
          type: string
        bio:
          type: string

    StudentCreateInput:
      type: object
      required:
        - email
        - password
        - name
        - universityId
        - fieldOfInterest
        - bio
      properties:
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        name:
          type: string
        universityId:
          type: string
          format: uuid
        fieldOfInterest:
          type: string
        bio:
          type: string

    StudentUpdateInput:
      type: object
      required:
        - name
        - universityId
        - fieldOfInterest
        - bio
      properties:
        name:
          type: string
        universityId:
          type: string
          format: uuid
        fieldOfInterest:
          type: string
        bio:
          type: string

    ProfessorResponseBase:
      required:
        - id
        - name
        - email
        - universityId
        - fieldOfStudy
        - bio
        - rankingScore
        - totalProjects
        - studentsSupervised
        - acceptanceRate
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        universityId:
          type: string
          format: uuid
        fieldOfStudy:
          type: string
        bio:
          type: string
        rankingScore:
          type: integer
        totalProjects:
          type: integer
        studentsSupervised:
          type: integer
        acceptanceRate:
          type: number

    ProfessorCreateInput:
      type: object
      required:
        - email
        - password
        - name
        - universityId
        - fieldOfStudy
        - bio
      properties:
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        name:
          type: string
        universityId:
          type: string
          format: uuid
        fieldOfStudy:
          type: string
        bio:
          type: string

    ProfessorUpdateInput:
      type: object
      required:
        - name
        - universityId
        - fieldOfStudy
        - bio
      properties:
        name:
          type: string
        universityId:
          type: string
          format: uuid
        fieldOfStudy:
          type: string
        bio:
          type: string

    ResearchProjectResponseBase:
      type: object
      required:
        - id
        - professorId
        - title
        - description
        - field
        - regionFocus
        - requirements
        - maxStudents
        - currentStudents
        - status
        - interviewQuestions
      properties:
        id:
          type: string
          format: uuid
        professorId:
          type: string
          format: uuid
          description: ID of the professor leading the project
        title:
          type: string
          description: Project title in the requested language
        description:
          type: string
          description: Project description in the requested language
        field:
          type: string
          description: Research field/category
        regionFocus:
          type: string
          description: Geographic focus or target region
        requirements:
          type: string
          description: Requirements for students applying
        maxStudents:
          type: integer
          description: Maximum number of students allowed
        currentStudents:
          type: integer
          description: Current number of students enrolled
        status:
          type: string
          enum:
            - OPEN
            - CLOSED
          description: Project status
        interviewQuestions:
          type: array
          # TODO: think about the "interview" object, and the concrete type
          items:
            type: object
          description: Interview questions for students

    ResearchProjectInput:
      type: object
      required:
        - professorId
        - title
        - description
        - field
        - regionFocus
        - requirements
        - maxStudents
        - status
        - interviewQuestions
      properties:
        professorId:
          type: string
          format: uuid
          description: ID of the professor leading the project
        title:
          type: string
          description: Project title in the requested language
        description:
          type: string
          description: Project description in the requested language
        field:
          type: string
          description: Research field/category
        regionFocus:
          type: string
          description: Geographic focus or target region
        requirements:
          type: string
          description: Requirements for students applying
        maxStudents:
          type: integer
          description: Maximum number of students allowed
        status:
          type: string
          description: Project status, e.g., "open", "closed"
        interviewQuestions:
          type: array
          # TODO: think about the "interview" object, and the concrete type
          items:
            type: object
          description: Interview questions for students

    ApplicationResponseBase:
      type: object
      required:
        - id
        - studentId
        - projectId
        - status
        - appliedAt
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
          description: ID of the student who applied
        projectId:
          type: string
          format: uuid
          description: ID of the research project applied to
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
          description: Application status
        # TODO: look into cv_url
        appliedAt:
          type: string
          format: date-time
          description: Timestamp when the application was submitted

    ApplicationInput:
      type: object
      required:
        - studentId
        - projectId
      properties:
        studentId:
          type: string
          format: uuid
          description: ID of the student who applied
        projectId:
          type: string
          format: uuid
          description: ID of the research project applied to

    UniversityResponseBase:
      type: object
      required:
        - id
        - name
        - country
        - region
        - rankingScore
        - totalResearchProjects
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Name of the university
        country:
          type: string
          description: Country where the university is located
        region:
          type: string
          description: Geographic region of the university
        rankingScore:
          type: integer
          description: University ranking score
        totalResearchProjects:
          type: integer
          description: Total number of research projects hosted by the university

    UniversityInput:
      type: object
      required:
        - name
        - country
        - rankingScore
      properties:
        name:
          type: string
          description: Name of the university
        country:
          type: string
          description: Country where the university is located
        rankingScore:
          type: integer
          description: University ranking score

  parameters:
    ID:
      name: id
      in: path
      required: true
      description: ID of object
      schema:
        type: string
        format: uuid

    PageNumber:
      name: page
      in: query
      description: Zero-based page index
      schema:
        type: integer
        minimum: 0
        default: 0

    PageSize:
      name: size
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    # 400
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    # 401
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    # 403
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    # 404
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  $ref: '#/components/schemas/Password'
      responses:
        '200':
          description: Successfully logged in (and received access token)
          content:
            application/json:
              schema:
                type: object
                required:
                  - meta
                  - data
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  data:
                    $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: authRefresh
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: Successfully refresh access token
          content:
            application/json:
              schema:
                type: object
                required:
                  - meta
                  - data
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  data:
                    $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'


  /api/students:
    security:
      - accessTokenBearer: []

    get:
      tags: [students]
      summary: Get all students
      operationId: getAllStudents
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'

    post:
      tags: [students]
      summary: Create a new student
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateInput'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/students/{id}:
    security:
      - accessTokenBearer: []

    parameters:
      - $ref: '#/components/parameters/ID'

    get:
      tags: [students]
      summary: Get student by ID
      operationId: getStudentById
      responses:
        '200':
          description: Student found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [students]
      summary: Replace student by ID
      operationId: replaceStudentById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateInput'
      responses:
        '200':
          description: Student replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [students]
      summary: Delete student
      operationId: deleteStudentById
      responses:
        '204':
          description: Student deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/professors:
    security:
      - accessTokenBearer: []

    get:
      tags: [professors]
      summary: Get all professors
      operationId: getAllProfessors
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of professors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorListResponse'

    post:
      tags: [professors]
      summary: Create a new professor
      operationId: createProfessor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessorCreateInput'
      responses:
        '201':
          description: Professor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'


  /api/professors/{id}:
    security:
      - accessTokenBearer: []

    parameters:
      - $ref: '#/components/parameters/ID'

    get:
      tags: [professors]
      summary: Get professor by ID
      operationId: getProfessorById
      responses:
        '200':
          description: Professor found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [professors]
      summary: Replace professor by ID
      operationId: replaceProfessorById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessorUpdateInput'
      responses:
        '200':
          description: Professor replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [professors]
      summary: Delete professor
      operationId: deleteProfessorById
      responses:
        '204':
          description: Professor deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/research-projects:
    security:
      - accessTokenBearer: []

    get:
      tags: [research-projects]
      summary: Get all research projects
      operationId: getAllResearchProjects
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of research projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchProjectListResponse'

    post:
      tags: [research-projects]
      summary: Create a new research project
      operationId: createResearchProject
      requestBody:
        required: true
