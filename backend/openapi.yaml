                $ref: '#/components/schemas/ResearchProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'


  /api/research-projects/{id}:
    security:
      - accessTokenBearer: []

    parameters:
      - $ref: '#/components/parameters/ID'

    get:
      tags: [research-projects]
      summary: Get research project by ID
      operationId: getResearchProjectById
      responses:
        '200':
          description: Research project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [research-projects]
      summary: Replace research project by ID
      operationId: replaceResearchProjectById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchProjectInput'
      responses:
        '200':
          description: Research project replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [research-projects]
      summary: Delete research project
      operationId: deleteResearchProjectById
      responses:
        '204':
          description: Research project deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/applications:
    security:
      - accessTokenBearer: []

    get:
      tags: [applications]
      summary: Get all applications
      operationId: getAllApplications
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'

    post:
      tags: [applications]
      summary: Create a new application
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'


  /api/applications/{id}:
    security:
      - accessTokenBearer: []

    parameters:
      - $ref: '#/components/parameters/ID'

    get:
      tags: [applications]
      summary: Get application by ID
      operationId: getApplicationById
      responses:
        '200':
          description: Application found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [applications]
      summary: Replace application by ID
      operationId: replaceApplicationById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '200':
          description: Application replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
