spring:
  application:
    name: backend
  servlet:
    multipart:
      # Professor CVs are capped at 10 MB and avatars at 2 MB in ProfessorService;
      # the servlet limits must leave room for both.
      max-file-size: 10MB
      max-request-size: 12MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile
            redirect-uri: "${FRONTEND_URL:https://usp.uz}/api/login/oauth2/code/google"
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://db:5432/appdb
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  frontend-url: ${FRONTEND_URL:https://usp.uz}
