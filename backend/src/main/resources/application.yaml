spring:
  application:
    name: backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://db:5432/appdb
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  frontend-url: ${FRONTEND_URL:https://usp.uz}
