events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format  access_log  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /dev/stdout access_log;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name usp.uz;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name usp.uz;

        ssl_certificate /etc/letsencrypt/live/usp.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/usp.uz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Proxy frontend (Next.js on port 3000)
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API proxy to backend
        location /api/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
        }
    }
}

